name: runner-3
run-name: runner-3 (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Koneksi mode: web (ttyd+tmux+filebrowser) atau ssh (tmate client)"
        type: choice
        options:
          - web
          - ssh
        default: web

concurrency:
  group: vps-3
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      RUNNER_ID: "3"
      MODE: ${{ inputs.mode || 'web' }}
      TARGET_BRANCH: "runner-3"
    steps:
      - name: Clone private repo
        run: |
          set -eo pipefail
          mkdir -p ~/work
          if ! git clone --depth 1 -b "$TARGET_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${PRIVATE_REPO}.git" ~/work/vps; then
            echo "Clone branch $TARGET_BRANCH belum ada, mencoba clone default branch..."
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PRIVATE_REPO}.git" ~/work/vps
            cd ~/work/vps
            git checkout -b "$TARGET_BRANCH" || true
          fi

      - name: Start runner
        run: |
          cd ~/work/vps
          exec bash run.sh
